<div class="container">

  <!-- Carregando -->
  <div
    class="card"
    *ngIf="carregando"
  >
    <p>
      Calculando sua pontuação...
    </p>
  </div>


  <!-- Erro -->
  <div
    class="card"
    *ngIf="erro"
  >
    <p class="erro">
      {{ erro }}
    </p>
  </div>


  <!-- Resultado -->
  <div
    class="card"
    *ngIf="
      !carregando &&
      !erro &&
      resultado
    "
  >

    <h2>
      🏆 Resultado
    </h2>

    <p class="quiz-nome">
      {{ resultado.quizTitulo }}
    </p>


    <div class="pontuacao-destaque">
      {{ resultado.pontuacao }} pontos
    </div>


    <p class="detalhe">

      Você acertou

      <strong>
        {{ resultado.acertos }}
      </strong>

      de

      <strong>
        {{ resultado.totalPerguntas }}
      </strong>

      perguntas

    </p>


    <div class="barra-acertos">

      <div
        class="barra-fill"
        [style.width.%]="resultado.pontuacao"
      ></div>

    </div>


    <div class="acoes">

      <button
        class="btn-secundario"
        (click)="revisarRespostas()"
      >
        Revisar respostas
      </button>


      <button
        class="btn-secundario"
        (click)="verHistorico()"
      >
        Ver histórico
      </button>


      <button
        class="btn-principal"
        (click)="irParaFinal()"
      >
        Continuar
      </button>

    </div>

  </div>

</div>
