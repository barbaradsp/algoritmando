<div class="container">

  <main class="card">

    <div class="icone">
      👤
    </div>


    <h1>
      Antes de começar
    </h1>


    <p class="descricao">

      Você escolheu

      <strong>
        {{ quizState.quizTitulo }}
      </strong>

    </p>


    <form
      [formGroup]="cadastroForm"
      (ngSubmit)="cadastrar()"
      novalidate
    >

      <!-- NOME -->

      <div class="campo">

        <label for="nome">
          Nome
        </label>


        <input
          id="nome"
          type="text"

          formControlName="nome"

          placeholder="Digite seu nome"

          maxlength="100"

          autocomplete="name"

          [class.input-invalido]="
            campoInvalido('nome')
          "

          [attr.aria-invalid]="
            campoInvalido('nome')
          "

          aria-describedby="erro-nome"

          (input)="
            limparErroServidor(
              'nome'
            )
          "
        >


        <small
          id="erro-nome"

          class="mensagem-erro"

          *ngIf="
            campoInvalido('nome')
          "
        >
          {{ mensagemNome() }}
        </small>

      </div>


      <!-- EMAIL -->

      <div class="campo">

        <label for="email">
          E-mail
        </label>


        <input
          id="email"
          type="email"

          formControlName="email"

          placeholder="seuemail@exemplo.com"

          maxlength="254"

          autocomplete="email"

          [class.input-invalido]="
            campoInvalido('email')
          "

          [attr.aria-invalid]="
            campoInvalido('email')
          "

          aria-describedby="erro-email"

          (input)="
            limparErroServidor(
              'email'
            )
          "
        >


        <small
          id="erro-email"

          class="mensagem-erro"

          *ngIf="
            campoInvalido('email')
          "
        >
          {{ mensagemEmail() }}
        </small>

      </div>


      <!-- ERRO GERAL -->

      <div
        class="erro-geral"

        *ngIf="
          erroGeral
        "
      >
        ⚠️ {{ erroGeral }}
      </div>


      <!-- BOTÃO -->

      <button
        type="submit"

        class="btn-principal"

        [disabled]="carregando"
      >

        <span
          *ngIf="
            !carregando
          "
        >
          Começar quiz
        </span>


        <span
          *ngIf="
            carregando
          "
        >
          Cadastrando...
        </span>

      </button>

    </form>

  </main>

</div>
